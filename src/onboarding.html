<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunden-Onboarding · Gewerke-Anfragen</title>
<style>
:root{--brand:#1d3557;--brand-h:#13263f;--acc:#2a9d8f;--bg:#f3f5f8;--card:#fff;--ink:#0f1f35;--mut:#5d6b7e;--line:#dfe4ea;--chip:#edf1f5;--acc2:#e6eef6;--ok:#1a7f37;--okbg:#e6f4ea;--warn:#a35f00;--warnbg:#fff3df;--bad:#c4001d;--badbg:#fde8eb;--hdr:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#7fa6d6;--brand-h:#9cbbe3;--acc:#4fc3b4;--bg:#0f1520;--card:#18202d;--ink:#e6eaf0;--mut:#98a4b5;--line:#2a3445;--chip:#232d3c;--acc2:#1a2c44;--ok:#4caf50;--okbg:#173322;--warn:#e0a030;--warnbg:#3a2c12;--bad:#ff6b7a;--badbg:#3d1a20;--hdr:#141b27;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#7fa6d6;--brand-h:#9cbbe3;--acc:#4fc3b4;--bg:#0f1520;--card:#18202d;--ink:#e6eaf0;--mut:#98a4b5;--line:#2a3445;--chip:#232d3c;--acc2:#1a2c44;--ok:#4caf50;--okbg:#173322;--warn:#e0a030;--warnbg:#3a2c12;--bad:#ff6b7a;--badbg:#3d1a20;--hdr:#141b27;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:18px;padding:0 28px;min-height:60px;background:var(--hdr);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--brand)}
header .tag{font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--acc);color:#fff;border-radius:4px;padding:2px 7px}
.sp{flex:1}
#saveState{font-size:12px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:26px 24px 110px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px}
.steps button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);font-size:12px;font-weight:700}
.steps button.done .n{background:var(--okbg);color:var(--ok)}
.steps button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.steps button.on .n{background:#fff;color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 6px;color:var(--brand)}
.card h3{font-size:14px;margin:16px 0 6px}
.mut{color:var(--mut)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
label.f span.h{font-weight:400;color:var(--mut);font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--acc2)}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px}
button.b{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
button.b:hover:not(:disabled){background:var(--brand-h)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b{color:#0f1520}}
button.s,label.s{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
button.s:hover,label.s:hover{border-color:var(--brand);background:var(--acc2)}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;padding:2px 6px}
button.x:hover{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
td input[type=text],td input[type=number]{width:100%}
.scroll{max-height:460px;overflow:auto}
.scroll th{position:sticky;top:0;background:var(--card);z-index:1}
.drop{border:2px dashed var(--line);border-radius:8px;padding:30px 20px;text-align:center;color:var(--mut);background:var(--bg)}
.drop.over{border-color:var(--brand);background:var(--acc2);color:var(--brand)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--mut)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.msg{font-size:13px;margin-top:8px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--brand)}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--hdr);border-top:1px solid var(--line);padding:12px 28px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:4}
/* Vorschau des Kopfbereichs der Kunden-App */
.pv{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f3f5f8;color:#0f1f35}
.pv .hd{display:flex;align-items:center;gap:14px;background:#fff;padding:10px 16px;position:relative}
.pv .hd::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--pp) 0 78%,var(--pa) 78% 100%)}
.pv .hd img{height:28px;max-width:180px;object-fit:contain}
.pv .hd .nm{font-weight:800;color:var(--pp)}
.pv .hd .t{font-weight:700;color:var(--pp);padding-left:12px;border-left:1px solid #dfe4ea}
.pv .hd .t i{font-style:normal;margin-left:6px;background:var(--pa);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}
.pv .bd{padding:18px 16px 14px;display:flex;gap:8px;align-items:center}
.pv .st{border-radius:999px;padding:4px 12px;font-size:12px;border:1px solid #dfe4ea;background:#fff;color:#5d6b7e}
.pv .st.on{background:var(--pp);border-color:var(--pp);color:#fff}
.pv .bt{margin-left:auto;background:var(--pp);color:#fff;border-radius:6px;padding:6px 14px;font-weight:600;font-size:12px}
.logoBox{display:flex;align-items:center;gap:12px}
.logoBox img{max-height:48px;max-width:220px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.check li{margin:4px 0}
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>Kunden-Onboarding</h1><span class="tag">Gewerke-Anfragen</span>
  <span class="sp"></span>
  <span id="saveState"></span>
  <label class="s" title="Ein früher heruntergeladenes Kundenpaket (.zip) zum Weiterbearbeiten öffnen">Kundenpaket öffnen<input type="file" id="pkgIn" accept=".zip" hidden></label>
  <button class="s" id="newBtn" title="Entwurf verwerfen und neu beginnen">Neu beginnen</button>
</header>
<main>
  <div class="steps" id="steps"></div>
  <div id="step"></div>
</main>
<div class="foot" id="foot"></div>

</body>
</html>
